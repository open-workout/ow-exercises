name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check unique human_readable_ids
        run: python3 scripts/check_unique_human_readable_ids.py
      - name: Validate exercise schema
        run: python3 scripts/validate_exercises.py
