name: Monthly release

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate before releasing
        run: |
          python3 scripts/check_unique_human_readable_ids.py
          python3 scripts/validate_exercises.py
      - name: Build export bundle
        run: python3 scripts/export_bundle.py dist/exercises-bundle.json
      - name: Compute tag name
        id: tag
        run: echo "name=v$(date +'%Y.%m').0" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: dist/exercises-bundle.json
          generate_release_notes: true
